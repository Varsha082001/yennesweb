
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | YENNES</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header class="topbar">
     <!-- Logo -->
   <div class="logo">
    <a href="index.html">
        <img src="Images/YENNESLogo.jpg" alt="YENNES">
    </a>
</div>
    <a href="index.html" class="home-link">
        <i class="fa-solid fa-house"></i> Back to Home
    </a>
</header>

<main class="auth-wrapper">
    <section class="auth-card signup-card">

        <div class="auth-icon">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h1>Create Account</h1>
        <p class="subtitle">Sign up for your YENNES account</p>

        <form id="signupForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="fullName" name="fullName"
                           placeholder="Enter your full name"
                           autocomplete="name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="signupEmail" name="email"
                           placeholder="Enter your email"
                           autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signupPassword"
                           name="password" placeholder="Create a password"
                           autocomplete="new-password"
                           minlength="8" required>
                    <button type="button" class="toggle-password"
                            aria-label="Show password"
                            data-password="signupPassword">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <small class="field-help">Use at least 8 characters.</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Re-enter your password"
                           autocomplete="new-password"
                           minlength="8" required>
                    <button type="button" class="toggle-password"
                            aria-label="Show password"
                            data-password="confirmPassword">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <label class="terms">
                <input type="checkbox" id="agreeTerms" required>
                I agree to the
                <a href="Privacypolicy.html">Privacy Policy</a>.
            </label>

            <button type="submit" class="primary-btn">Create Account
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <p class="status-message" id="signupMessage" role="status"></p>
        </form>

        <p class="switch-page">
            Already have an
            
            
            account?
            <a href="login.html">Login</a>
        </p>

    </section>
</main>

<footer class="footer">
    <p>© 2026 YENNES | All Rights Reserved</p>
    <a href="Privacypolicy.html">Privacy Policy</a>
</footer>

<script src="auth.js"></script>
</body>
</html>
